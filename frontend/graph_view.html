    <script>
      const API =
        new URLSearchParams(location.search).get("api") ||
        window.__API_BASE_URL ||
        "http://127.0.0.1:8000";
      const USER_ID =
        new URLSearchParams(location.search).get("user_id") ||
        window.__USER_ID ||
        "";
      const TOP_N = 20;

      const cx = 500,
        cy = 400;
      const RADIUS = 300;

      function getRadialPosition(index, total) {
        const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
        return {
          x: cx + RADIUS * Math.cos(angle),
          y: cy + RADIUS * Math.sin(angle),
        };
      }

      async function loadGraph() {
        const edges = document.getElementById("edges");
        const nodes = document.getElementById("nodes");
        const svg = document.getElementById("graph-svg");
        const legendCount = document.getElementById("legend-count");
        if (!edges || !nodes || !svg) return;

        edges.innerHTML = "";
        nodes.innerHTML = "";

        if (!USER_ID) {
          nodes.innerHTML = `<text x="500" y="300" text-anchor="middle" fill="#6b7a69" font-family="Inter" font-size="16">Silakan login untuk melihat graph</text>`;
          if (legendCount) legendCount.textContent = "0";
          return;
        }

        try {
          const res = await fetch(
            API + "/history/" + encodeURIComponent(USER_ID),
            { method: "GET" }
          );
          const history = await res.json();

          if (!history || history.length === 0) {
            nodes.innerHTML = `<text x="500" y="300" text-anchor="middle" fill="#6b7a69" font-family="Inter" font-size="16">Belum ada riwayat untuk user ini</text>`;
            if (legendCount) legendCount.textContent = "0";
            return;
          }

          const topSongs = history.slice(0, TOP_N);
          svg.setAttribute("viewBox", "0 0 1000 800");

          // Draw edges from user center to each song
          topSongs.forEach((s, i) => {
            const pos = getRadialPosition(i, topSongs.length);
            edges.innerHTML += `
              <line x1="${cx}" y1="${cy}" x2="${pos.x}" y2="${pos.y}"
                    class="stroke-on-surface-variant/10 stroke-1"></line>
            `;
          });

          // Draw user node at center
          nodes.innerHTML += `
            <g class="user-node cursor-pointer group" data-label="User ID: ${USER_ID}" data-plays="-">
              <circle class="fill-[#3b82f6] filter drop-shadow-[0_0_8px_rgba(59,130,246,0.3)] transition-all duration-300" cx="${cx}" cy="${cy}" r="12"></circle>
              <circle class="fill-none stroke-[#3b82f6]/20 stroke-1 node-pulse" cx="${cx}" cy="${cy}" r="16"></circle>
              <text x="${cx}" y="${
            cy + 28
          }" text-anchor="middle" fill="#bccbb9" font-family="Inter" font-size="11" font-weight="600">${USER_ID}</text>
            </g>
          `;

          // Draw song nodes in radial layout
          topSongs.forEach((s, i) => {
            const pos = getRadialPosition(i, topSongs.length);
            const r = Math.max(12, 22 - i);
            const name = s.song_name || s.name || "Unknown";
            const artist = s.artist || "";
            const plays = s.playcount || 0;
            const fill =
              i === 0
                ? "filter drop-shadow-[0_0_12px_rgba(83,224,118,0.4)]"
                : "filter drop-shadow-[0_0_10px_rgba(83,224,118,0.3)]";
            // Label position: outward from center
            const dx = pos.x - cx;
            const dy = pos.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const nx = dx / dist;
            const ny = dy / dist;
            const labelX = pos.x + nx * (r + 8);
            const labelY = pos.y + ny * (r + 8);
            const textAnchor = nx > 0 ? "start" : "end";
            const nameX = nx > 0 ? labelX : labelX;
            nodes.innerHTML += `
              <g class="song-node cursor-pointer group" data-label="${name}" data-artist="${artist}" data-plays="${plays}">
                <circle class="fill-primary ${fill} transition-all duration-300" cx="${
              pos.x
            }" cy="${pos.y}" r="${r}"></circle>
                ${
                  i === 0
                    ? `<circle class="fill-none stroke-primary/30 stroke-1 node-pulse" cx="${
                        pos.x
                      }" cy="${pos.y}" r="${r + 6}"></circle>`
                    : ""
                }
                <text x="${labelX}" y="${
              labelY + 2
            }" text-anchor="${textAnchor}" fill="#e5e2e1" font-family="Inter" font-size="11" font-weight="600">${
              name.length > 20 ? name.slice(0, 18) + ".." : name
            }</text>
                <text x="${labelX}" y="${
              labelY + 16
            }" text-anchor="${textAnchor}" fill="#6b7a69" font-family="Inter" font-size="9">${artist}</text>
                <text x="${labelX}" y="${
              labelY + 30
            }" text-anchor="${textAnchor}" fill="#53e076" font-family="Inter" font-size="24px" font-weight="700">${plays}x</text>
              </g>
            `;
          });

          if (legendCount)
            legendCount.textContent = (1 + topSongs.length).toString();
        } catch (e) {
          nodes.innerHTML = `<text x="500" y="300" text-anchor="middle" fill="#ffb4ab" font-family="Inter" font-size="16">Gagal memuat graph</text>`;
          console.warn("Failed to load graph:", e);
        }
      }

      document.addEventListener("DOMContentLoaded", loadGraph);

      // Tooltip
      const tooltip = document.getElementById("tooltip");
      const tooltipTitle = document.getElementById("tooltip-title");
      const tooltipMeta = document.getElementById("tooltip-meta");
      const svg = document.getElementById("graph-svg");

      function setupTooltip() {
        const allNodes = document.querySelectorAll(".user-node, .song-node");
        allNodes.forEach((node) => {
          node.addEventListener("mouseenter", (e) => {
            const label = node.getAttribute("data-label");
            const artist = node.getAttribute("data-artist") || "";
            const plays = node.getAttribute("data-plays") || "-";
            if (node.classList.contains("user-node")) {
              tooltipTitle.textContent = label;
              tooltipMeta.textContent =
                plays === "-" ? "Listener" : plays + " plays";
            } else {
              tooltipTitle.textContent = label;
              tooltipMeta.textContent = artist
                ? artist + " • " + plays + " plays"
                : plays + " plays";
            }
            tooltip.classList.remove("hidden");
            tooltip.style.transform = "scale(1)";
            tooltip.style.left = e.clientX + 20 + "px";
            tooltip.style.top = e.clientY - 10 + "px";
          });
          node.addEventListener("mousemove", (e) => {
            tooltip.style.left = e.clientX + 20 + "px";
            tooltip.style.top = e.clientY - 10 + "px";
          });
          node.addEventListener("mouseleave", () => {
            tooltip.classList.add("hidden");
            tooltip.style.transform = "scale(0.9)";
          });
        });
      }

      const origLoadGraph = loadGraph;
      loadGraph = async function () {
        await origLoadGraph.call(this);
        setupTooltip();
        syncViewBox();
      };

      function syncViewBox() {
        const vb = svg.getAttribute("viewBox");
        if (vb) {
          const parts = vb.split(/\s+/).map(Number);
          viewBox = { x: parts[0], y: parts[1], w: parts[2], h: parts[3] };
        }
      }

      // Panning
      let isDragging = false;
      let startX, startY;
      let viewBox = { x: 0, y: 0, w: 1000, h: 800 };

      svg.addEventListener("mousedown", (e) => {
        if (e.target === svg) {
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          svg.classList.add("cursor-grabbing");
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - startX) * (viewBox.w / svg.clientWidth);
        const dy = (e.clientY - startY) * (viewBox.h / svg.clientHeight);
        viewBox.x -= dx;
        viewBox.y -= dy;
        svg.setAttribute(
          "viewBox",
          `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`
        );
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        svg.classList.remove("cursor-grabbing");
      });

      // Zoom (centered)
      document
        .querySelectorAll('button[title="Zoom In"], button[title="Zoom Out"]')
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            const factor = btn.title === "Zoom In" ? 0.8 : 1.25;
            const w_orig = viewBox.w;
            const h_orig = viewBox.h;
            viewBox.w *= factor;
            viewBox.h *= factor;
            viewBox.x += (w_orig - viewBox.w) / 2;
            viewBox.y += (h_orig - viewBox.h) / 2;
            svg.setAttribute(
              "viewBox",
              `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`
            );
          });
        });

      // Recenter
      document
        .querySelector('button[title="Recenter"]')
        .addEventListener("click", () => {
          viewBox = { x: 0, y: 0, w: 1000, h: 800 };
          svg.setAttribute("viewBox", `0 0 1000 800`);
        });
    </script>
    <script src="sidebar.js"></script>
  </body>
</html>
