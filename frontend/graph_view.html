        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;

        background-image: radial-gradient(
          circle at 2px 2px,

          transparent 0
        );
        background-size: 40px 40px;
      }
      .node-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.05);
        }
      }
      .glass-panel {
        backdrop-filter: blur(20px);
        background: rgba(18, 18, 18, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

        footer .player-extra {
          display: none !important;
        }
        footer .player-controls-main {
          display: none !important;
        }
        footer .player-progress {
          display: none !important;
        }
        footer {
          padding-left: 12px !important;
          padding-right: 12px !important;
          height: 64px !important;
        }
        footer .player-now-playing {
          min-width: 0 !important;
          flex: 1 !important;
        }
        footer .player-now-playing img {
          width: 40px !important;
          height: 40px !important;
        }
        footer .player-mobile-controls {
          display: flex !important;
        }
      }

    <script>
      const API = window.__API_BASE_URL || "http://127.0.0.1:8000";
      const USER_ID = window.__USER_ID || "";

      async function loadGraph() {
        try {
          const [usersRes, songsRes] = await Promise.all([
            fetch(API + "/users", { method: "GET" }),
            fetch(API + "/songs", { method: "GET" }),
          ]);
          const users = await usersRes.json();
          const songs = await songsRes.json();

          const edges = document.getElementById("edges");
          const nodes = document.getElementById("nodes");
          if (!edges || !nodes) return;

          edges.innerHTML = "";
          nodes.innerHTML = "";

          const userSpacing = Math.min(600 / Math.max(users.length, 1), 150);
          const songSpacing = Math.min(600 / Math.max(songs.length, 1), 150);

          const userStartY = Math.max(100, 400 - (users.length * userSpacing) / 2);
          const songStartY = Math.max(100, 400 - (songs.length * songSpacing) / 2);

          users.forEach((u, i) => {
            const cy = userStartY + i * userSpacing;
            nodes.innerHTML += `
              <g class="user-node cursor-pointer group" data-label="User: ${u.user_id}" data-playcount="-">
                <circle class="fill-[#3b82f6] filter drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]" cx="220" cy="${cy}" r="14"></circle>
                <circle class="fill-none stroke-[#3b82f6]/20 stroke-1 node-pulse" cx="220" cy="${cy}" r="18"></circle>
              </g>
            `;
            songs.forEach((s, j) => {
              const sy = songStartY + j * songSpacing;
              if (j < 5) {
                edges.innerHTML += `<line x1="220" x2="750" y1="${cy}" y2="${sy}" class="stroke-[#282828] stroke-1"></line>`;
              }
            });
          });

          songs.forEach((s, j) => {
            const sy = songStartY + j * songSpacing;
            if (j >= 5) return;
            nodes.innerHTML += `
              <g class="song-node cursor-pointer group" data-label="${s.name || 'Unknown'}" data-playcount="${s.artist || ''}">
                <circle class="fill-primary filter drop-shadow-[0_0_12px_rgba(29,185,84,0.6)]" cx="750" cy="${sy}" r="${Math.max(14, 22 - j * 2)}"></circle>
                <circle class="fill-none stroke-primary/30 stroke-1 node-pulse" cx="750" cy="${sy}" r="${Math.max(18, 28 - j * 2)}"></circle>
              </g>
            `;
          });

          const legendNodes = document.querySelector(".glass-panel .font-label-md.font-bold.text-on-surface");
          if (legendNodes) legendNodes.textContent = users.length + songs.length;
        } catch (e) {
          console.warn("Failed to load graph:", e);
        }
      }

      document.addEventListener("DOMContentLoaded", loadGraph);

      // Fix parent page scrolling to keep sidebar fixed
      try {
        const parentDoc = window.parent.document;
        const parentApp = parentDoc.querySelector(".stApp");
        if (parentApp) parentApp.style.overflow = "hidden";
        const frame = window.frameElement;
        if (frame) {
          frame.style.height = "100vh";
          frame.style.width = "100%";
          frame.style.border = "none";
        }
      } catch (e) {
        console.warn("Parent container styling failed:", e);
      }

      // Simple Interaction logic for the Graph
      const nodes = document.querySelectorAll(".user-node, .song-node");
      const tooltip = document.getElementById("tooltip");
      const tooltipTitle = document.getElementById("tooltip-title");
      const tooltipMeta = document.getElementById("tooltip-meta");
      const svg = document.getElementById("graph-svg");

      nodes.forEach((node) => {
        node.addEventListener("mouseenter", (e) => {
          const label = node.getAttribute("data-label");
          const plays = node.getAttribute("data-playcount");

          tooltipTitle.textContent = label;
          tooltipMeta.textContent = plays;

          tooltip.classList.remove("hidden");
          updateTooltipPosition(e, node);
        });

        node.addEventListener("mousemove", (e) => {
          updateTooltipPosition(e, node);
        });

        node.addEventListener("mouseleave", () => {
          tooltip.classList.add("hidden");
        });
      });

      function updateTooltipPosition(e, node) {
        const x = e.clientX;
        const y = e.clientY;
        const h = tooltip.offsetHeight;
        const w = tooltip.offsetWidth;
        const isUser = node.classList.contains("user-node");
        const pad = 10;
        let left;
        if (isUser) {
          left = x + pad;
          if (left + w > window.innerWidth - 12) left = x - w - pad;
        } else {
          left = x - w - pad;
          if (left < 12) left = x + pad;
        }
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(y - h - pad, 12) + "px";
      }

      // Panning logic (Micro-interaction)
      let isDragging = false;
      let startX, startY;
      let viewBox = { x: 0, y: 0, w: 1000, h: 800 };

      svg.addEventListener("mousedown", (e) => {
        if (e.target === svg) {
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - startX) * (viewBox.w / svg.clientWidth);
        const dy = (e.clientY - startY) * (viewBox.h / svg.clientHeight);

        viewBox.x -= dx;
        viewBox.y -= dy;

        svg.setAttribute(
          "viewBox",
          `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`
        );
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Zoom logic for buttons
      document
        .querySelectorAll('button[title="Zoom In"], button[title="Zoom Out"]')
        .forEach((btn) => {
          btn.addEventListener("click", () => {
            const factor = btn.title === "Zoom In" ? 0.9 : 1.1;
            viewBox.w *= factor;
            viewBox.h *= factor;
            svg.setAttribute(
              "viewBox",
              `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`
            );
          });
        });
    </script>
    <script src="sidebar.js"></script>
  </body>
</html>
