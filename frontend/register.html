<!DOCTYPE html>
<html class="dark" lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Music Recommendation | Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#474746",
              "surface-dim": "#131313",
              "on-error-container": "#ffdad6",
              "primary-fixed": "#72fe8f",
              tertiary: "#c8c6c6",
              "inverse-surface": "#e5e2e1",
              primary: "#53e076",
              "surface-bright": "#393939",
              "on-tertiary-fixed-variant": "#474747",
              "inverse-on-surface": "#313030",
              "on-primary-fixed": "#002108",
              "on-tertiary-fixed": "#1b1c1c",
              "primary-fixed-dim": "#53e076",
              "primary-container": "#1db954",
              "on-tertiary": "#303030",
              "on-secondary-fixed": "#1b1c1c",
              "tertiary-fixed": "#e4e2e2",
              "secondary-fixed": "#e5e2e1",
              "on-tertiary-fixed-variant": "#474747",
              "on-tertiary-container": "#383838",
              "on-secondary-fixed-variant": "#474746",
              "outline-variant": "#3d4a3d",
              background: "#131313",
              "surface-container-highest": "#353534",
              secondary: "#c8c6c5",
              "surface-container-lowest": "#0e0e0e",
              "on-primary-fixed-variant": "#005320",
              "tertiary-fixed-dim": "#c8c6c6",
              "on-surface-variant": "#bccbb9",
              "on-error": "#690005",
              "surface-container-high": "#2a2a2a",
              "surface-variant": "#353534",
              "on-primary": "#003914",
              "error-container": "#93000a",
              "secondary-fixed-dim": "#c8c6c5",
              "on-background": "#e5e2e1",
              error: "#ffb4ab",
              "primary-fixed-dim": "#53e076",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            spacing: {
              xs: "4px",
              sm: "8px",
              md: "16px",
              lg: "24px",
              xl: "32px",
            },
          },
        },
      };
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #131313;
        overflow-x: hidden;
      }
      .register-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 32px 24px;
        box-sizing: border-box;
      }
      .register-card {
        width: 100%;
        max-width: 420px;
        background: #1c1b1b;
        border: 1px solid #3d4a3d;
        border-radius: 24px;
        padding: 28px 28px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .register-brand {
        text-align: center;
        margin-bottom: 20px;
      }
      .register-brand h1 {
        font-size: 32px;
        font-weight: 800;
        color: #53e076;
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1.2;
      }
      .register-brand p {
        color: #bccbb9;
        font-size: 14px;
        margin: 4px 0 0;
      }
      .register-brand .sub {
        color: #6b7a69;
        font-size: 13px;
        margin-top: 4px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #bccbb9;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .form-group .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .form-group .input-wrapper .icon {
        position: absolute;
        left: 14px;
        color: #bccbb9;
        font-size: 20px;
        pointer-events: none;
      }
      .form-group .input-wrapper .toggle-pass {
        position: absolute;
        right: 14px;
        background: none;
        border: none;
        color: #bccbb9;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
      }
      .form-group .input-wrapper .toggle-pass:hover {
        color: #e5e2e1;
      }
      .form-group input {
        width: 100%;
        padding: 14px 14px 14px 44px;
        background: #2a2a2a;
        border: 1px solid #3d4a3d;
        border-radius: 12px;
        color: #e5e2e1;
        font-size: 15px;
        font-family: "Inter", sans-serif;
        outline: none;
        transition: all 0.2s;
      }
      .form-group input::placeholder {
        color: #6b7a69;
      }
      .form-group input:focus {
        border-color: #53e076;
        box-shadow: 0 0 0 3px rgba(83, 224, 118, 0.15);
      }
      .form-group input.error {
        border-color: #ffb4ab;
        box-shadow: 0 0 0 3px rgba(255, 180, 171, 0.15);
      }
      .password-hint {
        font-size: 11px;
        color: #6b7a69;
        margin-top: 4px;
      }
      .btn-primary {
        width: 100%;
        padding: 14px;
        background: #53e076;
        color: #002108;
        font-size: 15px;
        font-weight: 700;
        font-family: "Inter", sans-serif;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      .btn-primary:hover {
        background: #72fe8f;
        transform: scale(1.01);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 16px 0;
        color: #6b7a69;
        font-size: 12px;
        font-weight: 500;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #3d4a3d;
      }
      .social-buttons {
        display: flex;
        gap: 8px;
      }
      .social-buttons button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        background: #2a2a2a;
        border: 1px solid #3d4a3d;
        border-radius: 12px;
        color: #e5e2e1;
        font-size: 13px;
        font-weight: 600;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        transition: all 0.2s;
      }
      .social-buttons button:hover {
        background: #353534;
        border-color: #869585;
      }
      .login-prompt {
        text-align: center;
        margin-top: 16px;
        color: #bccbb9;
        font-size: 13px;
      }
      .login-prompt a {
        color: #53e076;
        text-decoration: none;
        font-weight: 600;
      }
      .login-prompt a:hover {
        color: #72fe8f;
      }
      .error-message {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(147, 0, 10, 0.2);
        border: 1px solid #93000a;
        border-radius: 12px;
        color: #ffb4ab;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .error-message .icon {
        font-size: 20px;
      }
      .success-message {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(29, 185, 84, 0.15);
        border: 1px solid #1db954;
        border-radius: 12px;
        color: #72fe8f;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .success-message .icon {
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <script>if (window===window.top) location.replace("index.html")</script>
    <!-- Register Section -->
    <div class="register-container">
      <div class="register-card">
        <div class="register-brand">
          <h1>Music Recomendation</h1>
          <p>Welcome Back</p>
          <p class="sub">Sign in to continue your music journey</p>
        </div>

        <div class="error-message" id="errorMessage">
          <span class="material-symbols-outlined icon">error</span>
          <span id="errorText">An error occurred</span>
        </div>
        <div class="success-message" id="successMessage">
          <span class="material-symbols-outlined icon">check_circle</span>
          <span>Account created successfully! Redirecting...</span>
        </div>

        <form id="registerForm" onsubmit="return handleRegister(event)">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">person</span>
              <input
                id="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">lock</span>
              <input
                id="password"
                type="password"
                placeholder="Min. 8 characters"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="toggle-pass"
                onclick="togglePassword()"
              >
                <span class="material-symbols-outlined" id="passIcon"
                  >visibility_off</span
                >
              </button>
            </div>
            <p class="password-hint">
              Use at least 8 characters with letters and numbers
            </p>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">verified_user</span>
              <input
                id="confirm_password"
                type="password"
                placeholder="Repeat password"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-primary">Register</button>
        </form>

        <div class="divider">or register with</div>

        <div class="social-buttons">
          <button onclick="alert('Google login coming soon')">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google
          </button>
          <button onclick="alert('Facebook login coming soon')">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1877F2">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
            Facebook
          </button>
        </div>

        <div class="login-prompt">
          have had an account? <a href="#" onclick="goToLogin()">Sign in</a>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const pass = document.getElementById("password");
        const icon = document.getElementById("passIcon");
        if (pass.type === "password") {
          pass.type = "text";
          icon.innerText = "visibility";
        } else {
          pass.type = "password";
          icon.innerText = "visibility_off";
        }
      }

      const API = new URLSearchParams(location.search).get("api") || window.__API_BASE_URL || "http://127.0.0.1:8000";

      function goToLogin() {
        try { parent.navigate("Login"); } catch (e) { location.hash = "#Login"; }
      }

      async function handleRegister(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;
        const errorMsg = document.getElementById("errorMessage");
        const errorText = document.getElementById("errorText");
        const successMsg = document.getElementById("successMessage");

        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        if (!username || !password || !confirm) {
          errorText.textContent = "Harap isi semua bidang";
          errorMsg.style.display = "flex";
          return false;
        }

        if (password.length < 8) {
          errorText.textContent = "Password minimal 8 karakter";
          errorMsg.style.display = "flex";
          return false;
        }

        if (password !== confirm) {
          errorText.textContent = "Password tidak cocok";
          errorMsg.style.display = "flex";
          return false;
        }

        try {
          const res = await fetch(API + "/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: username }),
          });
          const data = await res.json();

          successMsg.style.display = "flex";

          setTimeout(function () {
            try { parent.navigate("Login"); } catch (e) { location.hash = "#Login"; }
          }, 1500);
        } catch (e) {
          errorText.textContent =
            "Cannot connect to server. Make sure the backend is running.";
          errorMsg.style.display = "flex";
        }

        return false;
      }
    </script>
  </body>
</html>
